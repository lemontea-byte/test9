<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find the Moon - Escape Game</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080612;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#game {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;

    background:
        radial-gradient(circle at 20% 20%, #24143d 0%, transparent 20%),
        radial-gradient(circle at 80% 30%, #17102e 0%, transparent 25%),
        linear-gradient(#080612, #120a20);
}

/* =========================
   STARS
========================= */

.star {
    position: absolute;
    color: white;
    font-size: 14px;
    opacity: 0.8;
}

.star1 { left: 8%; top: 12%; }
.star2 { left: 20%; top: 25%; font-size: 10px; }
.star3 { left: 35%; top: 10%; }
.star4 { left: 52%; top: 20%; font-size: 11px; }
.star5 { left: 68%; top: 9%; }
.star6 { left: 82%; top: 23%; font-size: 10px; }
.star7 { left: 92%; top: 12%; }
.star8 { left: 45%; top: 35%; font-size: 9px; }
.star9 { left: 15%; top: 42%; font-size: 9px; }
.star10 { left: 60%; top: 40%; font-size: 10px; }

/* =========================
   TOP BAR
========================= */

#topBar {
    position: absolute;
    top: 0;
    left: 0;

    width: 100%;
    height: 70px;

    background: rgba(8, 5, 18, 0.92);
    border-bottom: 1px solid #392452;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 0 25px;

    z-index: 50;
}

#title {
    color: #d8c8ff;
    font-size: 22px;
    font-weight: bold;
}

#area {
    color: #b99cff;
    font-size: 18px;
}

#timer {
    color: white;
    font-size: 20px;
    font-weight: bold;
}

/* =========================
   MOON
========================= */

#moon {
    position: absolute;

    right: 8%;
    top: 12%;

    font-size: 65px;

    filter: drop-shadow(0 0 15px #bda6ff);
}

/* =========================
   GROUND
========================= */

#ground {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 27%;

    background: #0d0915;

    border-top: 2px solid #251737;
}

/* =========================
   HOUSES
========================= */

.house {
    position: absolute;

    bottom: 27%;

    width: 130px;
    height: 100px;

    background: #21142f;

    border: 2px solid #3b2750;
}

.house::before {
    content: "";

    position: absolute;

    left: -15px;
    top: -55px;

    border-left: 80px solid transparent;
    border-right: 80px solid transparent;
    border-bottom: 55px solid #2c1b40;
}

.house .window {
    position: absolute;

    width: 28px;
    height: 28px;

    background: #6d4a89;

    border: 2px solid #4b315e;

    top: 25px;
    left: 20px;

    box-shadow: 0 0 10px #8d65a8;
}

.house .door {
    position: absolute;

    width: 30px;
    height: 55px;

    background: #120b1b;

    bottom: 0;
    right: 20px;
}

.house1 {
    left: 8%;
}

.house2 {
    left: 65%;
    transform: scale(0.8);
}

/* =========================
   TREES
========================= */

.tree {
    position: absolute;

    bottom: 27%;

    width: 70px;
    height: 120px;
}

.tree::before {
    content: "🌲";

    font-size: 75px;

    position: absolute;

    left: 0;
    top: 0;

    filter: brightness(0.55);
}

.tree1 {
    left: 32%;
}

.tree2 {
    left: 52%;
}

.tree3 {
    left: 88%;

    transform: scale(0.8);
}

/* =========================
   STREET LIGHTS
========================= */

.streetLight {
    position: absolute;

    bottom: 27%;

    width: 8px;
    height: 120px;

    background: #30253a;
}

.streetLight::before {
    content: "💡";

    position: absolute;

    top: -30px;
    left: -14px;

    font-size: 28px;

    filter: drop-shadow(0 0 8px #d8b8ff);
}

.light1 {
    left: 45%;
}

.light2 {
    left: 75%;
}

/* =========================
   PLAYER
========================= */

#player {
    position: absolute;

    width: 42px;
    height: 55px;

    background: #a98bca;

    border: 3px solid #d8c8ff;

    border-radius: 10px;

    left: 12%;
    bottom: 27%;

    z-index: 20;

    box-shadow:
        0 0 12px rgba(190, 150, 255, 0.5);

    transition:
        bottom 0.12s ease-out;
}

#player::before {
    content: "• •";

    position: absolute;

    color: #171021;

    font-size: 13px;

    top: 10px;
    left: 8px;

    letter-spacing: 3px;
}

/* =========================
   PLAYER JUMP
========================= */

#player.jumping {
    bottom: 48%;
}

/* =========================
   KEY IN HAND
========================= */

#player.hasKey::after {
    content: "🔑";

    position: absolute;

    font-size: 22px;

    right: -19px;
    top: 17px;

    z-index: 30;

    transform: rotate(-15deg);

    filter: drop-shadow(0 0 4px #e0caff);
}

/* =========================
   KEY BOX
========================= */

/*
   The box is intentionally high.
   The player needs to jump to reach it.
*/

#keyBox {
    position: absolute;

    left: 55%;
    bottom: 52%;

    width: 58px;
    height: 58px;

    background: #3b2b4d;

    border: 3px solid #70558c;

    border-radius: 8px;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 28px;

    z-index: 15;

    box-shadow:
        0 0 12px rgba(120, 80, 160, 0.4);
}

/* Small platform under box */

#boxPlatform {
    position: absolute;

    left: 53.5%;
    bottom: 47%;

    width: 90px;
    height: 12px;

    background: #2d1b3d;

    border: 2px solid #52356a;

    border-radius: 5px;

    z-index: 12;
}

/* =========================
   DOOR
========================= */

#door {
    position: absolute;

    right: 5%;
    bottom: 27%;

    width: 65px;
    height: 115px;

    background: #171020;

    border: 4px solid #69477f;

    border-radius: 8px 8px 0 0;

    z-index: 10;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 30px;
}

#door.locked::after {
    content: "🔒";

    position: absolute;

    font-size: 25px;
}

#door:not(.locked)::after {
    content: "🚪";
}

/* =========================
   MESSAGE
========================= */

#message {
    position: absolute;

    left: 50%;
    bottom: 8%;

    transform: translateX(-50%);

    width: 80%;

    text-align: center;

    color: #d8c8ff;

    font-size: 17px;

    z-index: 40;
}

/* =========================
   MISSION WINDOW
========================= */

#missionPanel {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: min(600px, 90vw);

    background: rgba(14, 8, 25, 0.98);

    border: 2px solid #73518c;

    border-radius: 15px;

    padding: 25px;

    z-index: 100;

    box-shadow:
        0 0 30px rgba(120, 80, 170, 0.5);

    display: none;
}

#missionPanel h2 {
    margin-top: 0;

    color: #d8c8ff;

    text-align: center;
}

#progress {
    text-align: center;

    color: #aa8ed0;

    margin-bottom: 15px;
}

#missionText {
    text-align: center;

    font-size: 19px;

    line-height: 1.5;

    margin-bottom: 20px;
}

.choiceButton {
    display: block;

    width: 100%;

    margin: 10px 0;

    padding: 13px;

    background: #2c1b40;

    color: white;

    border: 1px solid #6d4b82;

    border-radius: 8px;

    font-size: 16px;

    cursor: pointer;
}

.choiceButton:hover {
    background: #4a2b5e;
}

#closeMission {
    display: block;

    margin: 20px auto 0;

    padding: 9px 25px;

    background: #181020;

    color: #cdb8e8;

    border: 1px solid #624778;

    border-radius: 7px;

    cursor: pointer;
}

/* =========================
   WIN / GAME OVER
========================= */

#endScreen {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    background: rgba(5, 3, 12, 0.96);

    display: none;

    justify-content: center;
    align-items: center;

    flex-direction: column;

    z-index: 200;

    text-align: center;
}

#endScreen h1 {
    color: #d8c8ff;

    font-size: 50px;

    margin-bottom: 10px;
}

#endScreen p {
    font-size: 20px;

    color: #bba7cf;
}

#restart {
    margin-top: 20px;

    padding: 12px 30px;

    background: #43265b;

    color: white;

    border: 1px solid #8962a3;

    border-radius: 8px;

    font-size: 17px;

    cursor: pointer;
}

#restart:hover {
    background: #5d3477;
}

/* =========================
   AREA NAME
========================= */

#areaName {
    position: absolute;

    left: 50%;
    top: 82px;

    transform: translateX(-50%);

    color: #8066a0;

    font-size: 14px;

    z-index: 30;
}

/* =========================
   JUMP HELP
========================= */

#jumpHelp {
    position: absolute;

    left: 20px;
    bottom: 20px;

    color: #8e78a8;

    font-size: 13px;

    z-index: 40;
}

</style>
</head>


<body>

<div id="game">

    <!-- Stars -->

    <div class="star star1">✦</div>
    <div class="star star2">✧</div>
    <div class="star star3">✦</div>
    <div class="star star4">✧</div>
    <div class="star star5">✦</div>
    <div class="star star6">✧</div>
    <div class="star star7">✦</div>
    <div class="star star8">✧</div>
    <div class="star star9">✦</div>
    <div class="star star10">✧</div>


    <!-- Top Bar -->

    <div id="topBar">

        <div id="title">
            🌙 Find the Moon
        </div>

        <div id="area">
            Area 1 / 3
        </div>

        <div id="timer">
            05:00
        </div>

    </div>


    <!-- Area Name -->

    <div id="areaName">
        Area 1 - The Quiet Street
    </div>


    <!-- Moon -->

    <div id="moon">
        🌙
    </div>


    <!-- Ground -->

    <div id="ground"></div>


    <!-- Houses -->

    <div class="house house1">

        <div class="window"></div>

        <div class="door"></div>

    </div>


    <div class="house house2">

        <div class="window"></div>

        <div class="door"></div>

    </div>


    <!-- Trees -->

    <div class="tree tree1"></div>
    <div class="tree tree2"></div>
    <div class="tree tree3"></div>


    <!-- Street Lights -->

    <div class="streetLight light1"></div>
    <div class="streetLight light2"></div>


    <!-- Box Platform -->

    <div id="boxPlatform"></div>


    <!-- Key Box -->

    <div id="keyBox">
        🔒
    </div>


    <!-- Player -->

    <div id="player"></div>


    <!-- Door -->

    <div id="door" class="locked"></div>


    <!-- Message -->

    <div id="message">
        Use the arrow keys to move.
        Press SPACE to jump!
    </div>


    <!-- Jump Help -->

    <div id="jumpHelp">
        ← ↑ ↓ → Move　|　SPACE Jump
    </div>


    <!-- Mission Window -->

    <div id="missionPanel">

        <h2>
            🔐 Key Box Challenge
        </h2>

        <div id="progress">
            Question 1 / 3
        </div>

        <div id="missionText"></div>

        <div id="choices"></div>

        <button id="closeMission">
            Close
        </button>

    </div>


    <!-- End Screen -->

    <div id="endScreen">

        <h1 id="endTitle">
            You win 🌟
        </h1>

        <p id="endText">
            You escaped all 3 areas!
        </p>

        <button id="restart">
            Play Again
        </button>

    </div>

</div>


<script>

/* =====================================
   GAME SETTINGS
===================================== */

const GAME_TIME = 300;

let timeLeft = GAME_TIME;

let currentArea = 1;

let hasKey = false;

let missionCompleted = false;

let gameOver = false;

let currentQuestion = 0;


/* =====================================
   PLAYER SETTINGS
===================================== */

let playerX = 12;

let playerY = 27;

const moveSpeed = 1.4;

let isJumping = false;

let canJump = true;


/* =====================================
   HTML ELEMENTS
===================================== */

const player =
    document.getElementById("player");

const keyBox =
    document.getElementById("keyBox");

const boxPlatform =
    document.getElementById("boxPlatform");

const door =
    document.getElementById("door");

const message =
    document.getElementById("message");

const timer =
    document.getElementById("timer");

const area =
    document.getElementById("area");

const areaName =
    document.getElementById("areaName");

const missionPanel =
    document.getElementById("missionPanel");

const missionText =
    document.getElementById("missionText");

const choices =
    document.getElementById("choices");

const progress =
    document.getElementById("progress");

const closeMission =
    document.getElementById("closeMission");

const endScreen =
    document.getElementById("endScreen");

const endTitle =
    document.getElementById("endTitle");

const endText =
    document.getElementById("endText");

const restart =
    document.getElementById("restart");


/* =====================================
   QUESTIONS
===================================== */

const questions = {

    /* AREA 1 */

    1: [

        {
            question:
            "🧮 What is 15 + 7?",

            choices: [
                "20",
                "21",
                "22",
                "23"
            ],

            answer: 2
        },

        {
            question:
            "🔢 What number comes next? 2 → 4 → 6 → 8 → ?",

            choices: [
                "9",
                "10",
                "11",
                "12"
            ],

            answer: 1
        },

        {
            question:
            "🍎 You have 5 apples. You eat 2 apples. How many are left?",

            choices: [
                "2",
                "3",
                "4",
                "7"
            ],

            answer: 1
        }

    ],


    /* AREA 2 */

    2: [

        {
            question:
            "🧮 What is 6 × 4?",

            choices: [
                "20",
                "22",
                "24",
                "26"
            ],

            answer: 2
        },

        {
            question:
            "🔢 What comes next? 5 → 10 → 15 → 20 → ?",

            choices: [
                "23",
                "24",
                "25",
                "30"
            ],

            answer: 2
        },

        {
            question:
            "🧠 Which one is different?",

            choices: [
                "🐶 Dog",
                "🐱 Cat",
                "🐟 Fish",
                "🌸 Flower"
            ],

            answer: 3
        }

    ],


    /* AREA 3 */

    3: [

        {
            question:
            "🧮 What is 50 - 18?",

            choices: [
                "30",
                "31",
                "32",
                "33"
            ],

            answer: 2
        },

        {
            question:
            "🔢 What number comes next? 3 → 6 → 12 → 24 → ?",

            choices: [
                "36",
                "42",
                "48",
                "50"
            ],

            answer: 2
        },

        {
            question:
            "🧠 Which word does NOT belong?",

            choices: [
                "🌙 Moon",
                "⭐ Star",
                "☀️ Sun",
                "🍎 Apple"
            ],

            answer: 3
        }

    ]

};


/* =====================================
   AREA NAMES
===================================== */

const areaNames = {

    1:
        "Area 1 - The Quiet Street",

    2:
        "Area 2 - The Purple Forest",

    3:
        "Area 3 - The Moonlit Town"

};


/* =====================================
   TIMER
===================================== */

function updateTimer() {

    let minutes =
        Math.floor(timeLeft / 60);

    let seconds =
        timeLeft % 60;

    timer.textContent =
        String(minutes).padStart(2, "0")
        + ":"
        + String(seconds).padStart(2, "0");

}


setInterval(function() {

    if (gameOver) return;

    timeLeft--;

    updateTimer();

    if (timeLeft <= 0) {

        loseGame();

    }

}, 1000);


/* =====================================
   PLAYER MOVEMENT
===================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (gameOver) return;

        if (
            missionPanel.style.display ===
            "block"
        ) {
            return;
        }


        /* =========================
           JUMP
        ========================= */

        if (
            event.code === "Space" &&
            canJump
        ) {

            event.preventDefault();

            jump();

            return;
        }


        /* =========================
           ARROW KEYS
        ========================= */

        if (
            event.key === "ArrowUp" ||
            event.key === "ArrowDown" ||
            event.key === "ArrowLeft" ||
            event.key === "ArrowRight"
        ) {

            event.preventDefault();


            if (
                event.key === "ArrowUp"
            ) {

                playerY += moveSpeed;

            }


            if (
                event.key === "ArrowDown"
            ) {

                playerY -= moveSpeed;

            }


            if (
                event.key === "ArrowLeft"
            ) {

                playerX -= moveSpeed;

            }


            if (
                event.key === "ArrowRight"
            ) {

                playerX += moveSpeed;

            }


            /* Keep player on screen */

            playerX =
                Math.max(
                    2,
                    Math.min(94, playerX)
                );

            playerY =
                Math.max(
                    27,
                    Math.min(75, playerY)
                );


            player.style.left =
                playerX + "%";

            if (!isJumping) {

                player.style.bottom =
                    playerY + "%";

            }


            checkObjects();

        }

    }
);


/* =====================================
   JUMP FUNCTION
===================================== */

function jump() {

    if (isJumping) return;

    isJumping = true;

    canJump = false;

    player.classList.add("jumping");


    /*
       Check the box while jumping.
    */

    setTimeout(function() {

        checkObjects();

    }, 120);


    /*
       Player comes back down.
    */

    setTimeout(function() {

        player.classList.remove(
            "jumping"
        );

        isJumping = false;

        /*
           Small delay before another jump.
        */

        setTimeout(function() {

            canJump = true;

        }, 150);

        checkObjects();

    }, 450);

}


/* =====================================
   CHECK OBJECTS
===================================== */

function checkObjects() {

    if (missionCompleted) {

        return;

    }


    const playerRect =
        player.getBoundingClientRect();

    const boxRect =
        keyBox.getBoundingClientRect();


    /*
       Find distance between player
       and key box.
    */

    const horizontalDistance =
        Math.abs(
            playerRect.left -
            boxRect.left
        );

    const verticalDistance =
        Math.abs(
            playerRect.top -
            boxRect.top
        );


    /*
       The box can only be reached
       when the player is jumping.
    */

    if (
        horizontalDistance < 80 &&
        verticalDistance < 100 &&
        isJumping
    ) {

        openMission();

        return;
    }


    /*
       Check door.
    */

    const doorRect =
        door.getBoundingClientRect();

    const doorDistance =
        Math.abs(
            playerRect.left -
            doorRect.left
        )
        +
        Math.abs(
            playerRect.top -
            doorRect.top
        );


    if (doorDistance < 100) {

        if (hasKey) {

            nextArea();

        } else {

            message.textContent =
                "🔒 The door is locked. Find the key first!";

        }

    }

}


/* =====================================
   OPEN MISSION
===================================== */

function openMission() {

    if (missionCompleted) return;

    missionPanel.style.display =
        "block";

    currentQuestion = 0;

    showQuestion();

}


/* =====================================
   SHOW QUESTION
===================================== */

function showQuestion() {

    const areaQuestions =
        questions[currentArea];

    const question =
        areaQuestions[currentQuestion];


    progress.textContent =
        "Question "
        + (currentQuestion + 1)
        + " / 3";


    missionText.textContent =
        question.question;


    choices.innerHTML = "";


    question.choices.forEach(
        function(choice, index) {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "choiceButton";

            button.textContent =
                choice;


            button.onclick =
                function() {

                    checkAnswer(index);

                };


            choices.appendChild(
                button
            );

        }
    );

}


/* =====================================
   CHECK ANSWER
===================================== */

function checkAnswer(
    selectedAnswer
) {

    const question =
        questions[currentArea]
        [currentQuestion];


    if (
        selectedAnswer ===
        question.answer
    ) {

        currentQuestion++;


        /*
           All 3 questions complete.
        */

        if (
            currentQuestion >= 3
        ) {

            missionCompleted = true;

            hasKey = true;


            /*
               Player now holds key.
            */

            player.classList.add(
                "hasKey"
            );


            /*
               Change box.
            */

            keyBox.textContent =
                "📦";

            keyBox.style.background =
                "#4a345d";


            /*
               Unlock door.
            */

            door.classList.remove(
                "locked"
            );


            message.textContent =
                "🌟 All 3 questions correct! You got the key! 🔑";


            progress.textContent =
                "Challenge Complete!";


            missionText.textContent =
                "You solved all 3 questions! The key is yours! 🔑";


            choices.innerHTML = "";

        }

        else {

            missionText.textContent =
                "Correct! ✨ Next question!";


            setTimeout(
                function() {

                    showQuestion();

                },
                500
            );

        }

    }

    else {

        message.textContent =
            "❌ Wrong answer. Try again!";

        missionText.textContent =
            "Not quite! Think a little more and try again.";

    }

}


/* =====================================
   CLOSE MISSION
===================================== */

closeMission.onclick =
function() {

    missionPanel.style.display =
        "none";

};


/* =====================================
   NEXT AREA
===================================== */

function nextArea() {

    if (!hasKey) return;


    /*
       Finish game after Area 3.
    */

    if (currentArea >= 3) {

        winGame();

        return;

    }


    currentArea++;

    hasKey = false;

    missionCompleted = false;

    currentQuestion = 0;


    player.classList.remove(
        "hasKey"
    );


    keyBox.textContent =
        "🔒";

    keyBox.style.background =
        "#3b2b4d";


    door.classList.add(
        "locked"
    );


    area.textContent =
        "Area "
        + currentArea
        + " / 3";


    areaName.textContent =
        areaNames[currentArea];


    /*
       Put player back at start.
    */

    playerX = 12;

    playerY = 27;


    player.style.left =
        playerX + "%";

    player.style.bottom =
        playerY + "%";


    /*
       Change key box location.
    */

    if (
        currentArea === 2
    ) {

        keyBox.style.left =
            "42%";

        boxPlatform.style.left =
            "40.5%";

    }


    if (
        currentArea === 3
    ) {

        keyBox.style.left =
            "68%";

        boxPlatform.style.left =
            "66.5%";

    }


    message.textContent =
        "🌌 Welcome to Area "
        + currentArea
        + "! Find the high key box!";

}


/* =====================================
   WIN
===================================== */

function winGame() {

    gameOver = true;

    endScreen.style.display =
        "flex";


    endTitle.textContent =
        "You win 🌟";


    endText.textContent =
        "You escaped all 3 areas and found the moon! 🌙";

}


/* =====================================
   LOSE
===================================== */

function loseGame() {

    gameOver = true;

    endScreen.style.display =
        "flex";


    endTitle.textContent =
        "Time's up! ⏰";


    endText.textContent =
        "The night is over... Try again!";

}


/* =====================================
   RESTART
===================================== */

restart.onclick =
function() {

    location.reload();

};


/* =====================================
   START GAME
===================================== */

updateTimer();

</script>

</body>
</html>
