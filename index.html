<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find the Moon - Escape Game</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #05050d;
        color: white;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    #game {
        width: 100vw;
        height: 100vh;
        position: relative;
        background:
            radial-gradient(circle at 20% 20%, #25204a 0%, transparent 18%),
            radial-gradient(circle at 80% 30%, #191536 0%, transparent 20%),
            linear-gradient(#080713, #110b20);
        overflow: hidden;
    }

    /* Stars */
    .star {
        position: absolute;
        color: #ffffff;
        font-size: 13px;
        opacity: 0.8;
        z-index: 1;
    }

    /* Moon */
    #moon {
        position: absolute;
        right: 8%;
        top: 8%;
        font-size: 70px;
        z-index: 2;
        filter: drop-shadow(0 0 15px #aaa6ff);
    }

    /* Game information */
    #topBar {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        width: 94%;
        max-width: 900px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 15px;
        background: rgba(10, 8, 25, 0.9);
        border: 1px solid #4b3b70;
        border-radius: 12px;
        z-index: 20;
    }

    #title {
        font-size: 20px;
        font-weight: bold;
        color: #ddd5ff;
    }

    #timer {
        font-size: 20px;
        font-weight: bold;
        color: #ffffff;
    }

    #areaText {
        font-size: 15px;
        color: #aaa3c7;
    }

    /* Game area */
    #world {
        position: absolute;
        left: 50%;
        top: 55%;
        transform: translate(-50%, -50%);
        width: min(92vw, 900px);
        height: min(70vh, 550px);
        border: 5px solid #35294c;
        border-radius: 18px;
        background:
            linear-gradient(
                rgba(20, 15, 37, 0.85),
                rgba(11, 10, 22, 0.95)
            );
        overflow: hidden;
        box-shadow: 0 0 30px rgba(65, 45, 100, 0.4);
    }

    /* Ground */
    #ground {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 42%;
        background: #111020;
        border-top: 2px solid #282044;
    }

    /* Player */
    #player {
        position: absolute;
        width: 32px;
        height: 40px;
        background: #ddd8ff;
        border-radius: 14px 14px 8px 8px;
        z-index: 10;
        box-shadow: 0 0 10px #7d6db3;
    }

    #player::before {
        content: "";
        position: absolute;
        width: 8px;
        height: 8px;
        background: #242039;
        border-radius: 50%;
        left: 7px;
        top: 11px;
        box-shadow: 11px 0 #242039;
    }

    /* Houses */
    .house {
        position: absolute;
        width: 90px;
        height: 70px;
        background: #28233d;
        border: 3px solid #41345d;
        z-index: 3;
    }

    .house::before {
        content: "";
        position: absolute;
        left: -12px;
        top: -45px;
        border-left: 57px solid transparent;
        border-right: 57px solid transparent;
        border-bottom: 45px solid #322646;
    }

    .window {
        position: absolute;
        width: 17px;
        height: 22px;
        background: #b5a2e8;
        box-shadow: 0 0 10px #8068ba;
        top: 18px;
        left: 16px;
    }

    .doorHouse {
        position: absolute;
        width: 20px;
        height: 35px;
        background: #161326;
        bottom: 0;
        right: 15px;
    }

    /* Trees */
    .tree {
        position: absolute;
        width: 25px;
        height: 70px;
        background: #161a20;
        border-radius: 5px;
        z-index: 4;
    }

    .tree::before {
        content: "";
        position: absolute;
        left: -27px;
        top: -55px;
        width: 80px;
        height: 80px;
        background: #17172b;
        clip-path: polygon(
            50% 0%,
            75% 35%,
            65% 35%,
            90% 65%,
            70% 65%,
            100% 100%,
            0% 100%,
            30% 65%,
            10% 65%,
            35% 35%,
            25% 35%
        );
    }

    /* Street lights */
    .streetLight {
        position: absolute;
        width: 6px;
        height: 100px;
        background: #292638;
        z-index: 5;
    }

    .streetLight::before {
        content: "";
        position: absolute;
        width: 35px;
        height: 35px;
        border-radius: 50%;
        background: #d8c8ff;
        left: -14px;
        top: -17px;
        box-shadow: 0 0 25px #9e87d0;
    }

    /* Key box */
    #keyBox {
        position: absolute;
        width: 75px;
        height: 75px;
        background: #3b2b4d;
        border: 4px solid #73528c;
        border-radius: 8px;
        z-index: 8;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 32px;
        box-shadow: 0 0 15px rgba(160, 120, 200, 0.4);
    }

    /* Door */
    #door {
        position: absolute;
        width: 65px;
        height: 110px;
        background: #251c32;
        border: 5px solid #795687;
        right: 25px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 7;
        border-radius: 7px 7px 0 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
    }

    #door.locked {
        opacity: 0.75;
    }

    #door.open {
        background: #3e3155;
        border-color: #b797d0;
    }

    /* Mission box */
    #missionPanel {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(90%, 430px);
        padding: 25px;
        background: rgba(13, 10, 27, 0.97);
        border: 2px solid #72568c;
        border-radius: 15px;
        text-align: center;
        z-index: 50;
        display: none;
        box-shadow: 0 0 30px rgba(80, 50, 100, 0.7);
    }

    #missionPanel h2 {
        margin-top: 0;
        color: #ddd0ff;
    }

    #missionText {
        line-height: 1.6;
        color: #c6bdd9;
    }

    #missionButton {
        margin-top: 15px;
        padding: 12px 25px;
        background: #4d3761;
        color: white;
        border: 1px solid #9273aa;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
    }

    #missionButton:hover {
        background: #624777;
    }

    /* Mission choices */
    #choices {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 15px;
    }

    .choice {
        padding: 12px 18px;
        background: #252039;
        border: 1px solid #665080;
        color: white;
        border-radius: 8px;
        cursor: pointer;
    }

    .choice:hover {
        background: #3a2d50;
    }

    /* Message */
    #message {
        position: absolute;
        bottom: 15px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(8, 7, 18, 0.9);
        border: 1px solid #403358;
        padding: 10px 18px;
        border-radius: 10px;
        color: #d5c9ec;
        z-index: 30;
        text-align: center;
        min-width: 250px;
    }

    /* Win / Game Over */
    #endScreen {
        position: absolute;
        inset: 0;
        background: rgba(5, 4, 12, 0.96);
        z-index: 100;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        text-align: center;
    }

    #endScreen h1 {
        font-size: 45px;
        color: #e4d8ff;
        margin-bottom: 10px;
    }

    #endScreen p {
        color: #aaa2bf;
        font-size: 18px;
    }

    #restartButton {
        margin-top: 20px;
        padding: 13px 30px;
        font-size: 17px;
        background: #4c3762;
        color: white;
        border: 1px solid #9877b1;
        border-radius: 10px;
        cursor: pointer;
    }

    @media (max-width: 600px) {
        #title {
            font-size: 15px;
        }

        #timer {
            font-size: 16px;
        }

        #areaText {
            font-size: 12px;
        }

        #moon {
            font-size: 45px;
        }

        #world {
            height: 65vh;
        }
    }
</style>
</head>

<body>

<div id="game">

    <!-- Stars -->
    <div class="star" style="left:5%;top:12%;">✦</div>
    <div class="star" style="left:12%;top:25%;">★</div>
    <div class="star" style="left:20%;top:8%;">✦</div>
    <div class="star" style="left:30%;top:18%;">·</div>
    <div class="star" style="left:40%;top:7%;">★</div>
    <div class="star" style="left:52%;top:20%;">✦</div>
    <div class="star" style="left:65%;top:10%;">·</div>
    <div class="star" style="left:73%;top:25%;">★</div>
    <div class="star" style="left:86%;top:18%;">✦</div>
    <div class="star" style="left:93%;top:35%;">·</div>

    <!-- Moon -->
    <div id="moon">🌙</div>

    <!-- Top information -->
    <div id="topBar">
        <div>
            <div id="title">🌙 Find the Moon - Escape Game</div>
            <div id="areaText">Area 1 / 3</div>
        </div>

        <div id="timer">05:00</div>
    </div>

    <!-- Game world -->
    <div id="world">

        <div id="ground"></div>

        <!-- Houses -->
        <div class="house" style="left:8%;bottom:40%;">
            <div class="window"></div>
            <div class="doorHouse"></div>
        </div>

        <div class="house" style="left:52%;bottom:43%;">
            <div class="window"></div>
            <div class="doorHouse"></div>
        </div>

        <!-- Trees -->
        <div class="tree" style="left:30%;bottom:40%;"></div>
        <div class="tree" style="left:72%;bottom:39%;"></div>
        <div class="tree" style="left:85%;bottom:45%;"></div>

        <!-- Street lights -->
        <div class="streetLight" style="left:25%;bottom:40%;"></div>
        <div class="streetLight" style="left:68%;bottom:40%;"></div>

        <!-- Key box -->
        <div id="keyBox">🔒</div>

        <!-- Door -->
        <div id="door" class="locked">🚪</div>

        <!-- Player -->
        <div id="player"></div>

    </div>

    <!-- Mission -->
    <div id="missionPanel">

        <h2>🔒 Key Box</h2>

        <div id="missionText">
            Complete the small mission to open the box!
        </div>

        <div id="choices"></div>

        <button id="missionButton">
            Close
        </button>

    </div>

    <!-- Message -->
    <div id="message">
        Use the arrow keys to move.
    </div>

    <!-- End screen -->
    <div id="endScreen">

        <h1 id="endTitle">You win 🌟</h1>

        <p id="endText">
            You escaped the night!
        </p>

        <button id="restartButton">
            Play Again
        </button>

    </div>

</div>


<script>

    /* ==============================
       GAME SETTINGS
       ============================== */

    const GAME_TIME = 300; // 5 minutes

    let timeLeft = GAME_TIME;
    let timer;

    let currentArea = 1;

    let hasKey = false;
    let missionCompleted = false;

    let gameOver = false;

    /*
       Player position
       x and y are percentages.
    */

    let playerX = 10;
    let playerY = 72;

    const moveSpeed = 2.5;


    /* ==============================
       GET HTML ELEMENTS
       ============================== */

    const player = document.getElementById("player");
    const keyBox = document.getElementById("keyBox");
    const door = document.getElementById("door");

    const timerText = document.getElementById("timer");
    const areaText = document.getElementById("areaText");

    const message = document.getElementById("message");

    const missionPanel = document.getElementById("missionPanel");
    const missionText = document.getElementById("missionText");
    const choices = document.getElementById("choices");
    const missionButton = document.getElementById("missionButton");

    const endScreen = document.getElementById("endScreen");
    const endTitle = document.getElementById("endTitle");
    const endText = document.getElementById("endText");

    const restartButton = document.getElementById("restartButton");


    /* ==============================
       AREA INFORMATION
       ============================== */

    const areas = {

        1: {
            mission: "Find the correct number: 2 + 3 = ?",
            answers: ["4", "5", "6"],
            correct: "5"
        },

        2: {
            mission: "Which one is different? 🌙 ⭐ 🌲 🍎",
            answers: ["🌙", "⭐", "🌲", "🍎"],
            correct: "🍎"
        },

        3: {
            mission: "Remember this: BLUE → PURPLE → BLACK. What comes after PURPLE?",
            answers: ["BLUE", "PURPLE", "BLACK"],
            correct: "BLACK"
        }

    };


    /* ==============================
       PLAYER POSITION
       ============================== */

    function updatePlayer() {

        player.style.left = playerX + "%";
        player.style.top = playerY + "%";

    }


    /* ==============================
       MOVE PLAYER
       ============================== */

    document.addEventListener("keydown", function(event) {

        if (gameOver) {
            return;
        }

        if (missionPanel.style.display === "block") {
            return;
        }

        if (
            event.key === "ArrowUp" ||
            event.key === "ArrowDown" ||
            event.key === "ArrowLeft" ||
            event.key === "ArrowRight"
        ) {

            event.preventDefault();

        }


        if (event.key === "ArrowUp") {

            playerY -= moveSpeed;

        }

        if (event.key === "ArrowDown") {

            playerY += moveSpeed;

        }

        if (event.key === "ArrowLeft") {

            playerX -= moveSpeed;

        }

        if (event.key === "ArrowRight") {

            playerX += moveSpeed;

        }


        /* Keep player inside the area */

        playerX = Math.max(3, Math.min(91, playerX));
        playerY = Math.max(8, Math.min(86, playerY));


        updatePlayer();

        checkObjects();

    });


    /* ==============================
       CHECK OBJECTS
       ============================== */

    function checkObjects() {

        /*
           Key box position changes slightly
           depending on the area.
        */

        let boxX;
        let boxY;

        if (currentArea === 1) {

            boxX = 70;
            boxY = 68;

        } else if (currentArea === 2) {

            boxX = 30;
            boxY = 30;

        } else {

            boxX = 65;
            boxY = 25;

        }


        /* Check key box */

        if (
            !missionCompleted &&
            Math.abs(playerX - boxX) < 8 &&
            Math.abs(playerY - boxY) < 10
        ) {

            openMission();

        }


        /* Check door */

        if (
            hasKey &&
            playerX > 82 &&
            playerY > 35 &&
            playerY < 75
        ) {

            openDoor();

        }

    }


    /* ==============================
       OPEN MISSION
       ============================== */

    function openMission() {

        missionPanel.style.display = "block";

        missionText.textContent = areas[currentArea].mission;

        choices.innerHTML = "";

        const answers = areas[currentArea].answers;

        answers.forEach(function(answer) {

            const button = document.createElement("button");

            button.className = "choice";

            button.textContent = answer;

            button.onclick = function() {

                checkAnswer(answer);

            };

            choices.appendChild(button);

        });

    }


    /* ==============================
       CHECK ANSWER
       ============================== */

    function checkAnswer(answer) {

        if (answer === areas[currentArea].correct) {

            missionCompleted = true;

            hasKey = true;

            keyBox.textContent = "🔑";

            keyBox.style.background = "#4a345d";

            door.classList.remove("locked");

            message.textContent =
                "Correct! You got the key. Find the door!";

            missionText.textContent =
                "Correct! The box is open. You got the key! 🔑";

            choices.innerHTML = "";

        } else {

            message.textContent =
                "Not correct! Try again.";

        }

    }


    /* ==============================
       CLOSE MISSION
       ============================== */

    missionButton.addEventListener("click", function() {

        missionPanel.style.display = "none";

    });


    /* ==============================
       OPEN DOOR
       ============================== */

    function openDoor() {

        if (!hasKey) {

            message.textContent =
                "The door is locked. Find the key first!";

            return;

        }


        /*
           If this is Area 1 or Area 2,
           move to the next area.
        */

        if (currentArea < 3) {

            currentArea++;

            changeArea();

        } else {

            winGame();

        }

    }


    /* ==============================
       CHANGE AREA
       ============================== */

    function changeArea() {

        areaText.textContent =
            "Area " + currentArea + " / 3";

        hasKey = false;

        missionCompleted = false;

        keyBox.textContent = "🔒";

        keyBox.style.background = "#3b2b4d";

        door.classList.add("locked");

        /*
           Put player at the left side
           of the new area.
        */

        playerX = 8;
        playerY = 72;

        updatePlayer();


        /*
           Change the key box position.
        */

        if (currentArea === 1) {

            keyBox.style.left = "70%";
            keyBox.style.top = "68%";

        }

        if (currentArea === 2) {

            keyBox.style.left = "30%";
            keyBox.style.top = "30%";

        }

        if (currentArea === 3) {

            keyBox.style.left = "65%";
            keyBox.style.top = "25%";

        }


        message.textContent =
            "Welcome to Area " + currentArea +
            "! Find the key box.";

    }


    /* ==============================
       TIMER
       ============================== */

    function startTimer() {

        timer = setInterval(function() {

            timeLeft--;

            updateTimer();


            if (timeLeft <= 0) {

                loseGame();

            }

        }, 1000);

    }


    function updateTimer() {

        let minutes =
            Math.floor(timeLeft / 60);

        let seconds =
            timeLeft % 60;

        let minuteText =
            minutes.toString().padStart(2, "0");

        let secondText =
            seconds.toString().padStart(2, "0");

        timerText.textContent =
            minuteText + ":" + secondText;


        /*
           Make the timer red near the end.
        */

        if (timeLeft <= 60) {

            timerText.style.color = "#ff9fa8";

        } else {

            timerText.style.color = "#ffffff";

        }

    }


    /* ==============================
       WIN
       ============================== */

    function winGame() {

        gameOver = true;

        clearInterval(timer);

        endTitle.textContent =
            "You win 🌟";

        endText.textContent =
            "You escaped all 3 areas and found the moon! 🌙";

        endScreen.style.display = "flex";

    }


    /* ==============================
       LOSE
       ============================== */

    function loseGame() {

        gameOver = true;

        clearInterval(timer);

        endTitle.textContent =
            "Time's up! ⏰";

        endText.textContent =
            "The night is over. Try again!";

        endScreen.style.display = "flex";

    }


    /* ==============================
       RESTART
       ============================== */

    restartButton.addEventListener("click", function() {

        location.reload();

    });


    /* ==============================
       START GAME
       ============================== */

    function startGame() {

        timeLeft = GAME_TIME;

        currentArea = 1;

        hasKey = false;

        missionCompleted = false;

        gameOver = false;

        playerX = 8;

        playerY = 72;

        keyBox.style.left = "70%";
        keyBox.style.top = "68%";

        keyBox.textContent = "🔒";

        keyBox.style.background = "#3b2b4d";

        door.classList.add("locked");

        areaText.textContent = "Area 1 / 3";

        message.textContent =
            "Use the arrow keys to move. Find the key box!";

        updatePlayer();

        updateTimer();

        startTimer();

    }


    startGame();

</script>

</body>
</html>
